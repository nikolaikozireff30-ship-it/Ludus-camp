<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUDUS Camp</title>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#FF0005;--silver:#A5A5A5;--head:'Tektur','Arial Narrow','PingFang SC','PingFang TC','Hiragino Sans GB','Microsoft YaHei','Microsoft JhengHei','Noto Sans SC','Noto Sans TC','Noto Sans CJK SC','Noto Sans CJK TC','Source Han Sans SC',sans-serif;--body:'Montserrat',Arial,'PingFang SC','PingFang TC','Hiragino Sans GB','Microsoft YaHei','Microsoft JhengHei','Noto Sans SC','Noto Sans TC','Noto Sans CJK SC','Noto Sans CJK TC','Source Han Sans SC',sans-serif;}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:#000;color:#fff}
.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}
.form{background:#0c0c0c;padding:22px 22px 60px;overflow-y:auto;max-height:100vh;border-right:1px solid #1c1c1c}
.brandrow{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.bolt{width:22px;height:22px;flex:none}
.logo{font-family:var(--head);font-weight:700;letter-spacing:3px;font-size:24px}
.headline{font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.5px;margin:10px 0 3px}
.form .hint{color:#7d7d7d;font-size:12px;margin-bottom:18px}
.form .hint.sub{font-style:italic;margin-top:0}
.fieldhint{font-size:11px;line-height:1.4;margin:1px 0 6px}
.grp{margin:0 0 16px;border-top:1px solid #1e1e1e;padding-top:14px}
.grp>label{display:block;font-family:var(--head);text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:#8f8f8f;margin-bottom:8px}
input[type=text],input[type=number],input[type=date],select{width:100%;background:#000;border:1px solid #303030;color:#fff;border-radius:8px;padding:9px 11px;font-family:var(--body);font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;margin-top:6px}
.chips button{flex:1;background:#000;border:1px solid #303030;color:#bbb;border-radius:8px;padding:7px 0;cursor:pointer;font-family:var(--head);font-size:13px}
.chips button.on{background:var(--red);color:#fff;border-color:var(--red)}
.opt{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px}
.opt input[type=checkbox]{width:17px;height:17px;accent-color:var(--red)}
.opt.dis{opacity:.32}
.opt.hl span{color:var(--red);font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px}
.qty input{width:64px;text-align:center}
.lang{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.lang button{background:#000;border:1px solid #333;color:#bbb;border-radius:7px;padding:7px 15px;cursor:pointer;font-family:var(--head);font-size:12px}
.lang button.on{background:#fff;color:#000}
.right{background:#1a1a1a;padding:20px;overflow:auto;max-height:100vh}
.bar{width:1123px;max-width:100%;display:flex;align-items:center;justify-content:flex-end;gap:14px;margin:0 auto 14px;flex-wrap:wrap}
.dl{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:14px}
.offerwrap{max-width:1123px;margin:0 auto;overflow:hidden}
.offer{position:relative;width:1123px;min-height:794px;transform-origin:top left;background:#fff;color:#111;padding:44px 52px 40px;overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.offer .acc{position:absolute;right:-160px;top:-160px;width:260px;height:260px;background:var(--red);transform:rotate(45deg)}
.o-wrap{position:relative;z-index:2}
.o-top{display:flex;justify-content:space-between;align-items:flex-start}
.o-lab{font-family:var(--head);text-transform:uppercase;letter-spacing:3px;font-size:12px;color:#6a6a6a}
.o-logo{display:flex;align-items:center;gap:8px}
.o-logo .w{font-family:var(--head);font-weight:700;letter-spacing:3px;font-size:20px;color:#111}
.o-title{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:54px;line-height:1;margin:14px 0 3px;color:#111}
.o-title i{font-style:normal;color:var(--red)}
.o-slogan{font-family:var(--head);letter-spacing:4px;font-size:13px;color:var(--red)}
.o-sub{font-size:15px;color:#6a6a6a;margin:4px 0 20px}
.o-meta{display:flex;border-top:2px solid var(--red);border-bottom:1px solid #e6e6e6;margin-bottom:22px}
.o-meta div{flex:1;padding:11px 4px 13px;border-right:1px solid #e6e6e6}.o-meta div:last-child{border-right:none}
.o-meta .k{font-family:var(--head);text-transform:uppercase;letter-spacing:1.5px;font-size:10px;color:#6a6a6a}
.o-meta .v{font-family:var(--head);font-size:19px;margin-top:3px;color:#111}
.o-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.o-cols h2{font-family:var(--head);text-transform:uppercase;letter-spacing:2px;font-size:15px;margin:0 0 12px;padding-bottom:7px;border-bottom:2px solid var(--red);display:inline-block;color:#111}
.inc{list-style:none;margin:0;padding:0}
.inc li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #e6e6e6;font-size:14px}
.inc .d{color:var(--red);font-family:var(--head)}
.inc b{font-weight:600}
/* Всплывающие подсказки в левом меню */
.tip{border-bottom:1px dotted #7a7a7a;cursor:help;position:relative}
.tip.help{border-bottom:none;color:#8f8f8f;font-size:13px}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;top:150%;width:250px;white-space:normal;background:#1e1e1e;border:1px solid #444;color:#fff;font-family:var(--body);font-weight:400;font-style:normal;text-transform:none;letter-spacing:0;font-size:11px;line-height:1.45;padding:9px 11px;border-radius:6px;z-index:30;box-shadow:0 8px 22px rgba(0,0,0,.5)}
table{width:100%;border-collapse:collapse}
td{padding:8px 0;border-bottom:1px solid #e6e6e6;font-size:13.5px;vertical-align:top}
td.r{text-align:right;font-family:var(--head);white-space:nowrap}
td .sm{color:#6a6a6a;font-size:11px}
tr.sub td{color:#6a6a6a} tr.disc td{color:var(--red)}
.o-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;border-top:2px solid var(--red);padding-top:12px}
.o-total .lab{font-family:var(--head);text-transform:uppercase;letter-spacing:2px;font-size:14px;color:#111}
.o-total .num{font-family:var(--head);font-weight:700;font-size:44px;color:var(--red);line-height:1}
.o-total .usd{color:#6a6a6a;font-family:var(--head);font-size:15px;margin-left:10px}
.o-pay{margin-top:10px;font-size:12.5px;color:#333}
.o-pay>div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}
.o-pay .pk{color:#6a6a6a}.o-pay b{font-family:var(--head)}
.o-foot{display:flex;justify-content:space-between;margin-top:26px;gap:20px}
.o-terms{font-size:11px;color:#6a6a6a;max-width:560px;line-height:1.6}
.o-cont{font-size:11px;text-align:right;line-height:1.7;color:#333}.o-cont b{font-family:var(--head);letter-spacing:1px;color:#111}
@media(max-width:900px){
  .app{display:block}
  .form{max-height:none;border-right:none;border-bottom:1px solid #1c1c1c}
  .right{max-height:none}
  input[type=text],input[type=number],input[type=date],select{font-size:16px}
}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .form,.bar{display:none!important}.app{display:block}
  .right{padding:0;background:#fff;max-height:none;overflow:visible}
  .offerwrap{max-width:none;height:auto!important;overflow:visible}
  .offer{transform:none!important;box-shadow:none;width:100%;min-height:auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="form">
    <div class="brandrow">
      <svg class="bolt" viewBox="0 0 24 24"><polygon points="13,1 3,14 10,14 8,23 21,9 13,9" fill="#FF0005"/></svg>
      <div class="logo">LUDUS <span data-i18n="kp">- CAMP</span></div>
    </div>
    <div class="headline" data-i18n="headline">Собери свой идеальный КЭМП</div>
    <div class="hint sub" data-i18n="hint">Цена и условия обновляются справа/ниже. Нажмите «Скачать PDF» — сверху.</div>
    <div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="en" class="on">EN</button><button data-l="it">IT</button><button data-l="fr">FR</button><button data-l="zh" lang="zh-Hans">简</button><button data-l="zt" lang="zh-Hant">繁</button></div>

    <div class="grp"><label data-i18n="g_client">Клиент и гости</label>
      <input type="text" id="client" data-i18n-ph="ph_client" placeholder="Имя клиента">
      <div class="row" style="margin-top:8px">
        <div><input type="number" id="guests" value="1" min="1"><div class="hint" data-i18n="guests" style="margin:4px 0 0">гостей</div></div>
        <div><input type="date" id="start"><div class="hint" style="margin:4px 0 0"><span data-i18n="checkin">дата заезда</span><span id="seasoninfo" style="display:block;margin-top:3px"></span></div></div>
      </div>
    </div>

    <div class="grp"><label data-i18n="g_dur">Срок (дней)</label>
      <div class="chips" id="durchips"><button data-d="7" data-i18n="w1">1 нед</button><button data-d="14" data-i18n="w2">2 нед</button><button data-d="28" data-i18n="w4">1 мес</button></div>
      <input type="number" id="days" value="14" min="1" style="margin-top:8px">
    </div>

    <div class="grp"><label data-i18n="g_pkg">Пакет</label>
      <select id="package"><option selected>STAY &amp; TRAIN</option><option>ALL-INCLUSIVE</option></select>
      <div class="fieldhint" style="margin-top:10px"><label data-i18n="g_room" style="margin:0 0 6px">Отель</label>
        <select id="hotel"></select>
        <div class="hint" style="margin:5px 0 0"><span class="tip help" data-tipkey="room">ⓘ</span> <span id="roominfo"></span></div></div>
    </div>

    <div class="grp"><label data-i18n="g_opt">Опции</label>
      <label class="opt" id="wrap-double"><input type="checkbox" id="double"> <span data-i18n="o_double">Двухместное размещение (дешевле)</span></label>
      <label class="opt" id="wrap-group"><input type="checkbox" id="group"> <span data-i18n="o_group">Групповая бронь от 8 номеров</span></label>
      <div class="fieldhint" id="groupinfo" style="display:none;margin:-2px 0 6px"></div>
      <div class="fieldhint" id="oddinfo" style="color:#f4c000;display:none;margin:-2px 0 6px"></div>
      <div class="opt" id="wrap-meallevel" style="gap:10px"><span data-i18n="o_meallevel">Уровень питания:</span>
        <select id="meallevel" style="flex:1"><option value="standard" data-i18n="ml_std">STANDARD</option><option value="standard_plus" data-i18n="ml_plus">STANDARD+</option><option value="champion" data-i18n="ml_champ">CHAMPION</option></select></div>
      <label class="opt" id="wrap-nobf"><input type="checkbox" id="nobf"> <span data-i18n="o_nobf">Без завтраков (только STAY &amp; TRAIN)</span></label>
      <div class="opt" id="wrap-meal" style="gap:10px"><span data-i18n="o_meal">Спец-питание:</span>
        <select id="mealspec" style="flex:1"><option value="" data-i18n="m_none">нет</option><option value="халяль" data-i18n="m_halal">халяль +15%</option><option value="веган" data-i18n="m_vegan">веган +10%</option></select></div>
      <div class="opt" style="gap:8px"><span data-i18n="o_welcome">Welcome-пакет:</span><span class="tip help" data-tipkey="welcome">ⓘ</span>
        <select id="welcome" style="flex:1"><option value="" data-i18n="w_none">нет</option><option value="базовый" data-i18n="w_basic">базовый 2 800</option><option value="без_шлема" data-i18n="w_nohelm">без шлема 4 700</option><option value="полный" data-i18n="w_full">полный 6 000</option></select></div>
      <div class="qty"><span data-i18n="o_massage">Массаж (сессий, −10%)</span><input type="number" id="massage" value="0" min="0"></div>
      <div class="qty"><span data-i18n="o_privc">Перс. тренировка (чемпион)</span><input type="number" id="privc" value="0" min="0"></div>
      <div class="qty"><span data-i18n="o_privs">Перс. тренировка (стандарт)</span><input type="number" id="privs" value="0" min="0"></div>
      <div class="fieldhint"><span class="tip" data-tipkey="trainers" data-i18n="pt_prompt">Чемпион и Стандарт — в чём разница?</span></div>
      <label class="opt"><input type="checkbox" id="transfer"> <span data-i18n="o_transfer">Трансфер из аэропорта</span></label>
      <label class="opt hl"><input type="checkbox" id="prepay"> <span data-i18n="o_prepay">Онлайн-предоплата: −3% OFF</span></label>
    </div>
  </div>

  <div class="right">
    <div class="bar">
      <button class="dl" onclick="window.print()" data-i18n="download">⬇ Скачать PDF</button>
    </div>
    <div class="offerwrap" id="offerwrap"><div class="offer" id="offer"></div></div>
  </div>
</div>

<script>
const PRICES={курс_thb_usd:35,
 // Продукт v7.2 (28.10.2026): выбор отеля, ставки LUDUS Hotel v2, без завтраков, группа −10% (см. ЦЕНОВОЙ_ДВИЖОК_СПЕК.md). Цены — THB на человека, БЕЗ VAT.
 // Цена гостя = программа (спорт + питание + сервис, фикс. за срок)
 //            + проживание (ночи × закупочная ставка отеля на дату × наценка кэмпа) / (2, если пара)
 // Программа и проживание на человека складываются и округляются до 50 ฿.
 // «соло» — гость оплачивает весь номер; «пара» — двое делят номер, цена с каждого.
 пакеты:{
  "STAY & TRAIN":{питание_день:210,меню:false,программа:{7:7500,14:13000,28:28000}},
  "ALL-INCLUSIVE":{питание_день:500,меню:true,программа:{7:9500,14:17100,28:36700}}},
 // Отели. Ставки — закупка за номер за ночь по датам заезда (периоды «ММ-ДД»; период через
 // Новый год задаётся с > по). LUDUS Hotel — ставки уже как цена клиента без VAT (наценка 1,0);
 // партнёры дают закупку без VAT — накидываем 15%. Комиссия отеля-партнёра — доход департамента,
 // в цену клиента не входит. Группа от 8 номеров одним заездом: только наш отель, ставка ×0,9
 // в любой сезон — дешевеет ТОЛЬКО жилая часть.
 отели:[
  // LUDUS Hotel: с 28.10.2026 ставки заданы сразу как цена клиента за ночь БЕЗ VAT (решение Ника) —
  // без деления на 1,07 и без наценки. Группа от 8 номеров −10% — по-прежнему только здесь.
  {id:"ludus",label:"LUDUS Hotel",наш:true,наценка:1.0,vat_в_цене:false,группа:true,с_продаж:"2026-12-01",
   ставки:[{с:"11-01",по:"11-30",цена:3271},{с:"12-01",по:"01-31",цена:4393},{с:"02-01",по:"03-31",цена:3271},
           {с:"04-01",по:"04-30",цена:2804},{с:"05-01",по:"09-30",цена:2430},{с:"10-01",по:"10-31",цена:2804}]},
  {id:"marina_std",label:"Marina House · Standard",наценка:1.15,
   ставки:[{с:"11-01",по:"11-30",цена:1550},{с:"12-01",по:"12-23",цена:1650},{с:"12-24",по:"01-10",цена:2750},
           {с:"01-11",по:"02-29",цена:1750},{с:"03-01",по:"03-31",цена:1650},{с:"04-01",по:"04-30",цена:1400},
           {с:"05-01",по:"10-31",цена:1250}]},
  {id:"marina_pool",label:"Marina House · Pool View",наценка:1.15,
   ставки:[{с:"11-01",по:"11-30",цена:1800},{с:"12-01",по:"12-23",цена:1900},{с:"12-24",по:"01-10",цена:3100},
           {с:"01-11",по:"02-29",цена:2000},{с:"03-01",по:"03-31",цена:1900},{с:"04-01",по:"04-30",цена:1650},
           {с:"05-01",по:"10-31",цена:1500}]},
  {id:"blue",label:"Blue Hotel",наценка:1.15,
   ставки:[{с:"03-01",по:"06-30",цена:1500},{с:"07-01",по:"10-31",цена:1200},{с:"11-01",по:"02-29",цена:3000}]},
  {id:"bora",label:"Bora Bora",наценка:1.15,
   ставки:[{с:"11-01",по:"04-30",цена:1350},{с:"05-01",по:"10-31",цена:1000}]}],
 отель_по_умолчанию:"ludus",
 группа_от:8,группа_ставка:0.9,       // групповая бронь — от 8 номеров одним заездом, ставка отеля ×0,8
 меню:{standard:{нед:0,день:500},standard_plus:{нед:1750,день:750},champion:{нед:3500,день:1000}},
 welcome:{полный:6000,без_шлема:4700,базовый:2800},массаж:690,массаж_скидка:0.10,
 приват:{чемпион:1500,стандарт:800},приват_скидка_кэмпер:0.15,
 трансфер:850,трансфер_мест:4,
 предоплата_доля:0.40,   // 40% при бронировании, остаток — не позднее 30 дней до заезда
 халяль_pct:0.15,веган_pct:0.10,предоплата_скидка:0.03,vat_pct:0.07};

function отель(id,cfg=PRICES){return cfg.отели.find(h=>h.id===id)||cfg.отели.find(h=>h.id===cfg.отель_по_умолчанию)||cfg.отели[0];}
// Закупочная ставка отеля за ночь по дате: ищем период «ММ-ДД», период через Новый год (с > по) — с переносом.
function закупка_ночи(h,d){const md=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 const r=h.ставки.find(x=>x.с<=x.по?(md>=x.с&&md<=x.по):(md>=x.с||md<=x.по));
 return r?r.цена:Math.min(...h.ставки.map(x=>x.цена));}
// Ставка для клиента за ночь (БЕЗ VAT): снимаем VAT, если он в закупке, и накидываем наценку кэмпа.
function ставка_клиента(h,закупка){return (h.vat_в_цене?закупка/(1+PRICES.vat_pct):закупка)*h.наценка;}
// Ночи заезда, сгруппированные по ставке (в порядке появления): [{закупка, ставка, ночей}].
// Считаем именно НОЧИ: заезд 25.10 на 14 дней = 7 ночей октября + 7 ночей ноября.
// Дата не выбрана — считаем по самой низкой ставке отеля и просим указать дату.
function ночи_по_ставкам(h,iso,D){
 const out={группы:[],известно:false,всего:D||0};
 if(!D)return out;
 const d0=iso?new Date(iso+"T12:00:00"):null;
 if(!d0||isNaN(d0)){const з=Math.min(...h.ставки.map(x=>x.цена));out.группы.push({закупка:з,ставка:ставка_клиента(h,з),ночей:D});return out;}
 out.известно=true;
 for(let i=0;i<D;i++){const з=закупка_ночи(h,new Date(d0.getTime()+i*864e5));
  const g=out.группы.find(x=>x.закупка===з);
  if(g)g.ночей++;else out.группы.push({закупка:з,ставка:ставка_клиента(h,з),ночей:1});}
 return out;}
// Сумма проживания за номер за весь заезд (без VAT, с наценкой).
function проживание_номера(н){return н.группы.reduce((a,g)=>a+g.ставка*g.ночей,0);}

// Программа на человека за срок: 7/14/28 дней — из прайса, промежуточные — интерполяция дневной ставки.
function ставка(ц,D){const a=ц[7]/7,b=ц[14]/14,c=ц[28]/28;
 if(D<=7)return a;if(D<=14)return a+(b-a)*(D-7)/7;if(D<=28)return b+(c-b)*(D-14)/14;return c;}
function окр50(x){return Math.round(x/50)*50;}
function calc(s,cfg=PRICES){
 const p=cfg.пакеты[s.пакет];const D=+s.дни||0,N=+s.гостей||0;if(!p||D<=0||N<=0)return null;
 const w=D/7,L=[];
 const разм=s.double?"пара":"соло";         // по умолчанию соло — гость оплачивает весь номер
 const h=отель(s.hotel,cfg), наш=!!h.наш;
 const ночи=ночи_по_ставкам(h,s.start,D);

 // Номера считаем по размещению: одноместно 1 гость = 1 номер, двухместно двое делят номер
 // (нечётный занимает свой). Групповая ставка — только наш отель и от 8 номеров.
 const номеров = s.double ? Math.ceil(N/2) : N;
 const группа = !!s.group && !!h.группа && номеров>=cfg.группа_от;
 const программа = ставка(p.программа,D)*D;
 const номер = проживание_номера(ночи)*(группа?cfg.группа_ставка:1);
 // Цена пакета на человека для типа размещения: программа + доля номера, округлённая до 50.
 function пакетДля(рм){return окр50(программа + номер/(рм==="пара"?2:1));}
 const база=пакетДля(разм);
 // В КП клиенту — только срок; разрез проживания по ночам менеджер видит слева, под датой заезда.
 L.push(["package",s.пакет,D+"d",база]);

 // Нечётная компания при парном размещении: пары складываются, а одному гостю
 // делить номер не с кем — он живёт один и платит одноместный тариф.
 // Разницу добавляем отдельной строкой; делим на N, потому что строки в L
 // хранятся «на человека» и умножаются на число гостей в конце.
 const непарный = s.double && N%2===1;
 if(непарный){const разница=пакетДля("соло")-пакетДля("пара");
  L.push(["odd","",'1×'+Math.round(разница),разница/N]);}

 let mealDay=p.питание_день;
 // «Без завтраков» (решение Ника 28.10.2026): только для пакетов без меню (STAY & TRAIN) —
 // завтрак выходит из программы по его стоимости питание_день × дни; спец-питание считать не от чего.
 const безЗавтрака = !!s.nobf && !p.меню && p.питание_день>0;
 if(безЗавтрака){L.push(["nobf","",D+"×"+p.питание_день,-p.питание_день*D]);mealDay=0;}
 if(p.меню){const lvl=(s.meal_level in cfg.меню)?s.meal_level:"standard";mealDay=cfg.меню[lvl].день;
  if(cfg.меню[lvl].нед>0)L.push([lvl==="champion"?"meal_champ":"meal_plus","",w+"w",cfg.меню[lvl].нед*w]);}
 if((s.meal==="халяль"||s.meal==="веган")&&mealDay>0){const pc=s.meal==="халяль"?cfg.халяль_pct:cfg.веган_pct;
  L.push([s.meal==="халяль"?"halal":"vegan","","",pc*mealDay*D]);}
 if(s.welcome&&cfg.welcome[s.welcome]!==undefined)L.push(["welcome",s.welcome,"",cfg.welcome[s.welcome]]);
 if(+s.massage>0)L.push(["massage","",s.massage+"×"+Math.round(cfg.массаж*(1-cfg.массаж_скидка)),cfg.массаж*(1-cfg.массаж_скидка)*s.massage]);
 const k=1-cfg.приват_скидка_кэмпер;
 if(+s.privc>0)L.push(["priv_champ","",s.privc+"×"+Math.round(cfg.приват.чемпион*k),cfg.приват.чемпион*k*s.privc]);
 if(+s.privs>0)L.push(["priv_std","",s.privs+"×"+Math.round(cfg.приват.стандарт*k),cfg.приват.стандарт*k*s.privs]);
 if(s.transfer){const машин=Math.ceil(N/cfg.трансфер_мест),всего=cfg.трансфер*машин;
  L.push(["transfer","",машин+"×"+cfg.трансфер,всего/N]);}
 const per=L.reduce((a,x)=>a+x[3],0);
 const sub=Math.round(per*N);
 const disc=s.prepay?Math.round(sub*cfg.предоплата_скидка):0;
 const net=sub-disc;const vat=Math.round(net*cfg.vat_pct);const tot=net+vat;
 // График оплаты: 40% берём от полной суммы к оплате без учёта скидки,
 // скидка целиком уходит во второй платёж (решение 18.09).
 const полн=sub+Math.round(sub*cfg.vat_pct);
 const pay1=Math.round(полн*cfg.предоплата_доля), pay2=tot-pay1;
 return{lines:L.map(x=>[x[0],x[1],x[2],Math.round(x[3]),Math.round(x[3]*N)]),N,sub,prepay:!!s.prepay,disc,vat,tot,
        usd:Math.round(tot/cfg.курс_thb_usd),разм,отель:h,наш,ночи,pay1,pay2,непарный,группа,безЗавтрака};
}

   Решение: пока дата не выбрана — держим поле текстовым со своим переводимым плейсхолдером,
   а по клику превращаем в настоящее поле даты и открываем календарь. */

 if(!d.value){d.type='text';d.placeholder=UI[l].ph_date;}}

   return '<tr'+(all<0?' class="disc"':'')+'><td>'+n+(det?'<div class="sm">'+det+'</div>':'')+'</td><td class="r">'+(all<0?'− ฿ '+fmt(-all):'฿ '+fmt(all))+'</td></tr>';}).join('');
 rows+='<tr class="sub"><td>'+t.sub+'</td><td class="r">฿ '+fmt(r.sub)+'</td></tr>';
 if(r.prepay)rows+='<tr class="disc"><td>'+t.prepay+'</td><td class="r">− ฿ '+fmt(r.disc)+'</td></tr>';
 rows+='<tr class="sub"><td>'+t.vat+'</td><td class="r">+ ฿ '+fmt(r.vat)+'</td></tr>';
 $('offer').innerHTML=`<div class="acc"></div><div class="o-wrap">
   <div class="o-top"><div class="o-lab">${t.lab}</div>
     <div class="o-logo">${BOLT}<span class="w">LUDUS</span></div></div>
   <div class="o-title">${t.t1} <i>${t.t2}</i></div>
   <div class="o-slogan">${SLOGAN}</div>
   <div class="o-sub">${t.subttl}</div>
   <div class="o-meta">
     <div><div class="k">${t.client}</div><div class="v">${$('client').value||t.dash}</div></div>
     <div><div class="k">${t.guests}</div><div class="v">${s.гостей}</div></div>
     <div><div class="k">${t.dates}</div><div class="v" style="font-size:15px">${dates}</div></div>
     <div><div class="k">${t.nights}</div><div class="v">${s.дни}</div></div>
   </div>
   <div class="o-cols">
     <div><h2>${t.inc}</h2><ul class="inc">${inc}</ul></div>
     <div><h2>${t.bd}</h2><table>${rows}</table>
       <div class="o-total"><div class="lab">${t.total}</div>
         <div><span class="num">฿ ${fmt(r.tot)}</span><span class="usd">≈ $${fmt(r.usd)}</span></div></div>
       <div class="o-pay"><div><span class="pk">${t.pay1}</span><b>฿ ${fmt(r.pay1)}</b></div>
         <div><span class="pk">${t.pay2}</span><b>฿ ${fmt(r.pay2)}</b></div></div></div>
   </div>
   <div class="o-foot"><div class="o-terms">${t.terms}</div>
     <div class="o-cont"><b>LUDUS · CHALONG</b><br>10/130 Moo 5, Chalong, Muang Phuket<br>${t.openLabel}<br>@ludus.phuket.muaythai · VEDA SIAM Co Ltd</div></div>
 </div>`;
 fitOffer();
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));
$('durchips').addEventListener('click',e=>{const b=e.target.closest('button');if(b){$('days').value=b.dataset.d;render();}});
$('lang').addEventListener('click',e=>{const b=e.target.closest('button');if(b){lang=b.dataset.l;[...$('lang').children].forEach(x=>x.classList.toggle('on',x===b));applyUI(lang);render();}});
window.addEventListener('resize',fitOffer);
// Список отелей — из PRICES.отели; названия отелей — бренды, не переводятся.
$('hotel').innerHTML=PRICES.отели.map(h=>'<option value="'+h.id+'"'+(h.id===PRICES.отель_по_умолчанию?' selected':'')+'>'+h.label+'</option>').join('');
applyUI(lang);render();
</script>
</body>
</html>
